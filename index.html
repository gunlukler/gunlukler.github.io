---
layout: default
---
<section class="giris">
  <h1>{{ site.title }}</h1>
  <p class="slogan">{{ site.description }}</p>
  <dl class="istatistik" id="istatistik" hidden></dl>
</section>

<section class="harita-kutu" id="harita-kutu" hidden>
  <div class="harita" id="harita"></div>
  <p class="harita-not">Son bir yıl · her kare bir gün</p>
</section>

<nav class="arac" id="arac" hidden>
  <div class="sekmeler" role="tablist">
    <button type="button" role="tab" data-gorunum="gun">Gün</button>
    <button type="button" role="tab" data-gorunum="hafta">Hafta</button>
    <button type="button" role="tab" data-gorunum="ay">Ay</button>
  </div>
  <input type="search" id="ara" placeholder="Günlüklerde ara…" aria-label="Günlüklerde ara">
  <button type="button" id="rastgele" class="rastgele" title="Rastgele bir gün aç">⚄</button>
</nav>

<div class="liste" id="liste" data-veri="{{ '/veri.json' | relative_url }}">
  {% for p in site.posts %}
    <p><a href="{{ p.url | relative_url }}">{{ p.date | date: "%d.%m.%Y" }} — {{ p.title }}</a></p>
  {% else %}
    <p class="bos">Henüz hiçbir şey yazılmadı.</p>
  {% endfor %}
</div>

<script src="{{ '/assets/gunluk.js' | relative_url }}" defer></script>
